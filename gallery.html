<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airshow Photography — Lucas Kautzky</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0b0d;
    --surface: #111315;
    --surface2: #181b1e;
    --border: rgba(255,255,255,0.06);
    --border2: rgba(255,255,255,0.12);
    --red: #C41E3A;
    --gold: #CFB53B;
    --gold2: #e8d06a;
    --text: #e8e6df;
    --muted: #6b6b63;
    --mono: 'Space Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 3rem; height: 56px;
    background: rgba(10,11,13,0.92); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border2);
  }
  .nav-logo { font-family: var(--mono); font-size: 12px; color: var(--gold); letter-spacing: 0.1em; }
  .nav-back {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em;
    color: var(--muted); text-transform: uppercase; transition: color 0.2s;
    display: flex; align-items: center; gap: 8px;
  }
  .nav-back:hover { color: var(--gold); }
  .nav-back svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }

  /* BLUEPRINT BG */
  .blueprint-bg {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(rgba(196,30,58,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(196,30,58,0.04) 1px, transparent 1px),
      linear-gradient(rgba(207,181,59,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(207,181,59,0.02) 1px, transparent 1px);
    background-size: 80px 80px, 80px 80px, 16px 16px, 16px 16px;
    opacity: 0.6;
  }

  /* HEADER */
  header {
    position: relative; z-index: 1;
    padding: 5.5rem 3rem 3rem;
    border-bottom: 1px solid var(--border2);
  }
  .header-eyebrow {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.25em;
    color: var(--gold); text-transform: uppercase; margin-bottom: 0.75rem;
    display: flex; align-items: center; gap: 10px;
  }
  .header-eyebrow::before { content: ''; width: 24px; height: 1px; background: var(--gold); display: block; }
  h1 { font-family: var(--mono); font-size: clamp(1.8rem, 4vw, 3rem); font-weight: 700; letter-spacing: -0.02em; margin-bottom: 0.5rem; }
  h1 em { color: var(--gold); font-style: normal; }
  .header-sub { font-size: 13px; color: var(--muted); font-weight: 300; font-family: var(--mono); letter-spacing: 0.05em; }

  /* GALLERY */
  main { position: relative; z-index: 1; padding: 2.5rem 3rem 5rem; }

  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 3px;
  }

  .gallery-item {
    position: relative; overflow: hidden; cursor: pointer;
    aspect-ratio: 3/2;
    background: var(--surface);
    border: 1px solid var(--border);
  }
  .gallery-item img {
    width: 100%; height: 100%; object-fit: cover;
    transition: transform 0.4s ease, filter 0.3s ease;
    filter: brightness(0.9) saturate(0.95);
    display: block;
  }
  .gallery-item:hover img { transform: scale(1.04); filter: brightness(1) saturate(1.05); }

  .gallery-item-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(10,11,13,0.7) 0%, transparent 50%);
    opacity: 0; transition: opacity 0.3s;
    display: flex; align-items: flex-end; padding: 0.75rem;
  }
  .gallery-item:hover .gallery-item-overlay { opacity: 1; }
  .gallery-item-num {
    font-family: var(--mono); font-size: 10px; color: var(--gold);
    letter-spacing: 0.1em;
  }

  /* LIGHTBOX */
  .lightbox {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(10,11,13,0.96);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  .lightbox.open { opacity: 1; pointer-events: all; }

  .lightbox-img-wrap {
    position: relative; max-width: 90vw; max-height: 85vh;
    display: flex; align-items: center; justify-content: center;
  }
  .lightbox-img-wrap img {
    max-width: 90vw; max-height: 85vh;
    object-fit: contain; border: 1px solid var(--border2);
    border-radius: 2px;
    box-shadow: 0 0 80px rgba(0,0,0,0.8);
  }

  .lightbox-close {
    position: fixed; top: 1.5rem; right: 2rem;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em;
    color: var(--muted); text-transform: uppercase; cursor: pointer;
    transition: color 0.2s; display: flex; align-items: center; gap: 6px;
    background: none; border: none;
  }
  .lightbox-close:hover { color: var(--gold); }

  .lightbox-nav {
    position: fixed; top: 50%; transform: translateY(-50%);
    background: rgba(10,11,13,0.7); border: 1px solid var(--border2);
    color: var(--muted); font-family: var(--mono); font-size: 18px;
    width: 44px; height: 44px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: color 0.2s, border-color 0.2s;
    border-radius: 2px;
  }
  .lightbox-nav:hover { color: var(--gold); border-color: var(--gold); }
  .lightbox-prev { left: 1.5rem; }
  .lightbox-next { right: 1.5rem; }

  .lightbox-counter {
    position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    letter-spacing: 0.1em;
  }

  /* FOOTER */
  footer {
    position: relative; z-index: 1;
    border-top: 1px solid var(--border2); padding: 1.75rem 3rem;
    display: flex; justify-content: space-between; align-items: center;
  }
  footer p { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 0.06em; }

  @media (max-width: 700px) {
    nav, header, main, footer { padding-left: 1.25rem; padding-right: 1.25rem; }
    .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 2px; }
    .lightbox-nav { display: none; }
  }
</style>
</head>
<body>

<div class="blueprint-bg"></div>

<nav>
  <span class="nav-logo">lucaskautzky.com</span>
  <a href="index.html" class="nav-back">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    Back to Portfolio
  </a>
</nav>

<header>
  <div class="header-eyebrow">Photography</div>
  <h1>Airshow <em>Gallery</em></h1>
  <p class="header-sub">// 29 photos &mdash; click any image to expand</p>
</header>

<main>
  <div class="gallery-grid" id="gallery">
  </div>
</main>

<footer>
  <p>&copy; 2026 Lucas Kautzky</p>
  <p>Iowa State University &mdash; Mechanical Engineering</p>
</footer>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">✕ &nbsp;Close</button>
  <button class="lightbox-nav lightbox-prev" onclick="changePhoto(-1)">&#8592;</button>
  <div class="lightbox-img-wrap">
    <img id="lightbox-img" src="" alt="Airshow photo">
  </div>
  <button class="lightbox-nav lightbox-next" onclick="changePhoto(1)">&#8594;</button>
  <div class="lightbox-counter" id="lightbox-counter"></div>
</div>

<script>
  const photos = [
    "DSC_0121.JPG","DSC_0137.JPG","DSC_0164.JPG","DSC_0198.JPG",
    "DSC_0241.JPG","DSC_0282.JPG","DSC_0287.JPG","DSC_0344.JPG",
    "DSC_0351.JPG","DSC_0356.JPG","DSC_0371.JPG","DSC_0388.JPG",
    "DSC_0395.JPG","DSC_0409.JPG","DSC_0412.JPG","DSC_0424.JPG",
    "DSC_0435.JPG","DSC_0439.JPG","DSC_0458.JPG","DSC_0467.JPG",
    "DSC_0546.JPG","DSC_0549.JPG","DSC_0576.JPG","DSC_0579.JPG",
    "DSC_0589.JPG","DSC_0591.JPG","DSC_0592.JPG","DSC_0593.JPG",
    "DSC_0596.JPG","DSC_0616.JPG","DSC_0639.JPG","DSC_0640.JPG"
  ];

  let current = 0;

  // Build grid
  const grid = document.getElementById('gallery');
  photos.forEach((filename, i) => {
    const item = document.createElement('div');
    item.className = 'gallery-item';
    item.innerHTML = `
      <img src="Airshow/${filename}" alt="Airshow photo ${i+1}" loading="lazy">
      <div class="gallery-item-overlay">
        <span class="gallery-item-num">${String(i+1).padStart(2,'0')} / ${photos.length}</span>
      </div>
    `;
    item.addEventListener('click', () => openLightbox(i));
    grid.appendChild(item);
  });

  function openLightbox(index) {
    current = index;
    updateLightbox();
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }

  function changePhoto(dir) {
    current = (current + dir + photos.length) % photos.length;
    updateLightbox();
  }

  function updateLightbox() {
    document.getElementById('lightbox-img').src = `airshow/${photos[current]}`;
    document.getElementById('lightbox-counter').textContent =
      `${String(current+1).padStart(2,'0')} / ${String(photos.length).padStart(2,'0')}`;
  }

  // Keyboard navigation
  document.addEventListener('keydown', e => {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key === 'ArrowRight') changePhoto(1);
    if (e.key === 'ArrowLeft') changePhoto(-1);
    if (e.key === 'Escape') closeLightbox();
  });

  // Click outside to close
  document.getElementById('lightbox').addEventListener('click', e => {
    if (e.target === document.getElementById('lightbox')) closeLightbox();
  });
</script>

</body>
</html>
